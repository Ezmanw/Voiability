name: Release v1

# Every push builds the app and (re)publishes it as the "v1" release:
# the v1 tag is moved to the pushed commit and the APK on the release is replaced.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v1
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      # Optional: add these repository secrets to sign with your own key, so every release can
      # be installed over the previous one. Without them the APK is signed with a throwaway
      # debug key and you need to uninstall before updating.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VOI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "VOI_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          VOI_KEYSTORE_PASSWORD: ${{ secrets.VOI_KEYSTORE_PASSWORD }}
          VOI_KEY_ALIAS: ${{ secrets.VOI_KEY_ALIAS }}
          VOI_KEY_PASSWORD: ${{ secrets.VOI_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Voiability-v1.apk

      - name: Point the v1 tag at this commit
        run: |
          git tag -f v1
          git push -f origin refs/tags/v1

      - name: Publish the v1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="On-device voice dictation for Android. Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}.

          Install Voiability-v1.apk, open the app and follow the setup. Needs an ARMv8.2+ phone with int8 matmul (Snapdragon 8 Gen 1 or newer) on Android 10+."
          if gh release view v1 > /dev/null 2>&1; then
            gh release edit v1 --title "Voiability v1" --notes "$notes" --latest
            gh release upload v1 Voiability-v1.apk --clobber
          else
            gh release create v1 Voiability-v1.apk --title "Voiability v1" --notes "$notes" --latest --verify-tag
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: Voiability-v1
          path: Voiability-v1.apk
